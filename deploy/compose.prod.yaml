# Production stack on the server (CHAT-54). deploy/release.sh copies this file to ~/kisaniti/compose.yaml.
# Images come from GitHub's container registry, built by CI for one exact commit (KN_TAG); nothing is built here.
# Only Caddy (80/443) and the storage broker (8883, MQTT over TLS, P3-2) are reachable from outside. PostgreSQL, the
# API, the website and the ingestion worker have no published ports.
# All values come from ~/kisaniti/.env on the server, which is never committed. Missing values stop compose at once.
name: kisaniti

x-logging: &logging
  driver: json-file
  options: {max-size: "10m", max-file: "3"}   # at most 30 MB of logs per service, so the disk cannot fill

x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:?}
  KISANITI_MODE: ${KISANITI_MODE:?}

services:
  db:
    image: postgres:17.6
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    image: ${KN_REGISTRY:?}/kisaniti-backend:${KN_TAG:?}
    restart: unless-stopped
    logging: *logging
    environment:
      <<: *backend-env
      KISANITI_COOKIE_SECURE: "true"
      KISANITI_ALLOWED_ORIGINS: https://${KN_APP_HOST:?}
      # WhatsApp (messaging/v1 amendment A1): optional; empty means the channel answers CHANNEL_NOT_AVAILABLE.
      # The owner writes these into ~/kisaniti/.env on the server; they are never in git or chat.
      KN_WA_TOKEN: ${KN_WA_TOKEN:-}
      KN_WA_PHONE_NUMBER_ID: ${KN_WA_PHONE_NUMBER_ID:-}
      KN_WA_API_VERSION: ${KN_WA_API_VERSION:-}
      KN_WA_TEMPLATES: ${KN_WA_TEMPLATES:-}
      KN_WA_APP_SECRET: ${KN_WA_APP_SECRET:-}
      KN_WA_VERIFY_TOKEN: ${KN_WA_VERIFY_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy

  assessor:
    image: ${KN_REGISTRY:?}/kisaniti-backend:${KN_TAG:?}
    restart: unless-stopped
    logging: *logging
    command: ["python", "-m", "kisaniti_api.devices.assess_job", "--every", "3600"]
    environment: *backend-env
    healthcheck:
      test: ["CMD-SHELL", "find /tmp/assessor.heartbeat -mmin -130 | grep -q ."]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    image: ${KN_REGISTRY:?}/kisaniti-frontend:${KN_TAG:?}
    restart: unless-stopped
    logging: *logging
    environment:
      KISANITI_API_URL: http://backend:8000
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/en/status').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      backend:
        condition: service_healthy

  caddy:
    # Automatic HTTPS (Let's Encrypt) for the website and the broker's host name; see deploy/Caddyfile
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      KN_DOMAIN: ${KN_DOMAIN:?}
      KN_APP_HOST: ${KN_APP_HOST:?}
      KN_MQTT_HOST: ${KN_MQTT_HOST:?}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy

  # ---- storage broker (P3-2): MQTT over TLS on 8883 with the public certificate of mqtt.<domain> ----
  brokercert:
    # copies Caddy's certificate for the broker's host name into mqtt_tls, readable by the broker only; see the script
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    logging: *logging
    entrypoint: ["sh", "/brokercert.sh"]
    environment:
      KN_MQTT_HOST: ${KN_MQTT_HOST:?}
    volumes:
      - ./broker/brokercert.sh:/brokercert.sh:ro
      - caddy_data:/data:ro
      - mqtt_tls:/tls
    healthcheck:
      test: ["CMD", "test", "-s", "/tls/key.pem"]
      interval: 5s
      timeout: 3s
      retries: 60
    depends_on:
      caddy:
        condition: service_started

  broker:
    image: eclipse-mosquitto:2.0.20
    restart: unless-stopped
    logging: *logging
    ports:
      - "8883:8883"
    networks:
      default:
        # inside the stack the worker reaches the broker by its public name, so the certificate's name matches
        aliases: ["${KN_MQTT_HOST:?}"]
    volumes:
      - ./broker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./broker/acl:/mosquitto/config/acl:ro
      - ./broker/auth:/mosquitto/auth:ro      # passwd: server only, made by release.sh and broker_user.sh
      - mqtt_tls:/mosquitto/tls:ro
      - mqttdata:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8883"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      brokercert:
        condition: service_healthy

  ingest:
    # kn-ingest (contract L3B v1): stores each reading, then acknowledges it; devices come from the database
    image: ${KN_REGISTRY:?}/kisaniti-ingest:${KN_TAG:?}
    restart: unless-stopped
    logging: *logging
    # set -e: stop with an error if the password file cannot be read, rather than connect without a password
    command: ["sh", "-c", "set -e; KN_MQTT_PASSWORD=\"$$(cat /run/kn/ingestion.password)\"; export KN_MQTT_PASSWORD; exec python -m kisaniti_ingestion.worker"]
    environment:
      KN_REGISTRY: db
      KN_STORE: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:?}
      KN_MQTT_HOST: ${KN_MQTT_HOST:?}
      KN_MQTT_PORT: "8883"
      # public roots on the server; the local check points this at Caddy's local CA (KN_INGEST_CA in .env)
      KN_MQTT_TLS_CA: ${KN_INGEST_CA:-/etc/ssl/certs/ca-certificates.crt}
      KN_MQTT_USER: ingestion
    volumes:
      - ./broker/ingestion.password:/run/kn/ingestion.password:ro
      - mqtt_tls:/run/kn/tls:ro
    depends_on:
      broker:
        condition: service_healthy
      backend:   # its start applies the database migrations
        condition: service_healthy

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  mqtt_tls:
  mqttdata:
