# KisanNiti storage broker on the server (P3-2, CHAT-54). Contract L3B v1 section 2.
# TLS with the public certificate Caddy obtains for mqtt.<domain>; brokercert copies it to /mosquitto/tls.
# Per-device users (passwd, server only, never in git) and topic rules (acl, the same file as the local broker).
per_listener_settings false
allow_anonymous false
password_file /mosquitto/auth/passwd
acl_file /mosquitto/config/acl

listener 8883
certfile /mosquitto/tls/fullchain.pem
keyfile /mosquitto/tls/key.pem
tls_version tlsv1.2

persistence true
persistence_location /mosquitto/data/
log_dest stdout
