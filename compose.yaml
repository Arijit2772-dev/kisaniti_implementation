# One command: docker compose up --build   then open http://localhost:3000
# Local development values only; copy .env.example to .env to change them. Never use these in a real deployment.
name: kisaniti
services:
  db:
    image: postgres:17.6
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kisaniti}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kisaniti-local-only}
      POSTGRES_DB: ${POSTGRES_DB:-kisaniti}
    ports:
      - "5433:5432"   # 5433 on the host so it does not clash with another local PostgreSQL
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-kisaniti}:${POSTGRES_PASSWORD:-kisaniti-local-only}@db:5432/${POSTGRES_DB:-kisaniti}
      KISANITI_MODE: ${KISANITI_MODE:-DEMO}
      # local development over plain HTTP: the session cookie cannot be Secure there; a deployment behind HTTPS must
      # set KISANITI_COOKIE_SECURE=true and its own website address in KISANITI_ALLOWED_ORIGINS
      KISANITI_COOKIE_SECURE: ${KISANITI_COOKIE_SECURE:-false}
      KISANITI_ALLOWED_ORIGINS: ${KISANITI_ALLOWED_ORIGINS:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  assessor:
    # Storage assessment job (devices/v1 amendment A1): assesses every active device once an hour and stores the result.
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "kisaniti_api.devices.assess_job", "--every", "3600"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-kisaniti}:${POSTGRES_PASSWORD:-kisaniti-local-only}@db:5432/${POSTGRES_DB:-kisaniti}
      KISANITI_MODE: ${KISANITI_MODE:-DEMO}
    healthcheck:
      # healthy while a pass finished in the last 130 minutes (the loop touches the file after every pass)
      test: ["CMD-SHELL", "find /tmp/assessor.heartbeat -mmin -130 | grep -q ."]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: frontend
    environment:
      KISANITI_API_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  pgdata:
