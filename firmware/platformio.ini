; KisanNiti storage node firmware (ESP32-WROOM-32 + SHT30 probe).
; Versions are pinned (OI-11). Contract: kisaniti/docs/contracts/L3b_SENSOR_STORAGE_CONTRACT_v1.md

[platformio]
default_envs = esp32dev

[common]
lib_deps =
    bblanchon/ArduinoJson @ 7.2.1
    256dpi/MQTT @ 2.5.2
build_flags =
    -Wall
    -DKN_FIRMWARE_VERSION=\"kn-fw-1.0.0\"

; Real node: Wi-Fi from include/secrets.h, MQTT over TLS, 5-minute samples,
; buffered samples deleted only after the backend's application ack.
[env:esp32dev]
platform = platformio/espressif32 @ 6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = ${common.lib_deps}
build_flags = ${common.build_flags}

; Wokwi digital twin: same source, simulation config (Wokwi-GUEST Wi-Fi,
; public test broker without TLS, 10-second samples, source_origin WOKWI_TWIN).
[env:wokwi]
platform = platformio/espressif32 @ 6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = ${common.lib_deps}
build_flags = ${common.build_flags} -DKN_SIMULATION=1

; Host unit tests for the pure parts (CRC, conversion, buffer, payload).
[env:native]
platform = platformio/native @ 1.2.1
test_framework = unity
lib_deps = bblanchon/ArduinoJson @ 7.2.1
build_flags = -std=c++17 -DKN_NATIVE_TEST=1
