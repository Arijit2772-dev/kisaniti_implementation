[project]
name = "kisaniti-core"
version = "0.1.0"
description = "KisanNiti shared pure algorithm core: exact quantities/money, contracts, allocation optimizer, oracle and validator. No web, database or network code."
requires-python = ">=3.13,<3.14"
dependencies = []

[project.optional-dependencies]
# Solver back ends for the allocation optimizer (imported lazily; the core works without them).
solvers = [
    "highspy==1.11.0",
    "pyscipopt==5.6.0",
    "ortools==9.14.6206",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "hypothesis==6.140.2",
    "ruff==0.14.1",
    "mypy==1.18.2",
    "jsonschema==4.25.1",
    "referencing==0.36.2",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kisaniti_core"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
strict = true
python_version = "3.13"
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["highspy", "highspy.*", "pyscipopt", "pyscipopt.*", "ortools", "ortools.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
