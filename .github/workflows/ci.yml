name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: core + contracts (lint, types, tests)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.5"
      - run: uv python install 3.13.9
      - run: uv sync --frozen --all-extras --python 3.13.9
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen mypy src tests
      - run: uv run --frozen pytest
      - name: Contract examples (valid pass, invalid fail)
        run: uv run --frozen pytest ../contracts/tests

  backend:
    name: backend (lint, types, tests on real PostgreSQL)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: kisaniti
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: kisaniti_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kisaniti -d kisaniti_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://kisaniti:ci-only@localhost:5432/kisaniti_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.5"
      - run: uv python install 3.13.9
      - run: uv sync --frozen --python 3.13.9
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen mypy src tests
      - run: uv run --frozen pytest

  ingestion:
    name: ingestion + simulator + conformance (lint, types, tests, self-test)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend/ingestion
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.5"
      - run: uv python install 3.13.9
      - run: uv sync --frozen --python 3.13.9
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen mypy src tests
      - run: uv run --frozen pytest
      - name: Simulator and in-process backend check each other against contract L3B v1
        run: uv run --frozen kn-conformance selftest

  frontend:
    name: frontend (lint, types, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run i18n:check
      - run: npm run build

  stack:
    name: one-command stack (docker compose up, health page)
    runs-on: ubuntu-24.04
    needs: [core, backend, ingestion, frontend]
    steps:
      - uses: actions/checkout@v5
      - run: docker compose up --build -d --wait --wait-timeout 300
      - run: curl -fsS http://localhost:8000/health/ready | tee ready.json && grep -q '"status":"READY"' ready.json
      - name: Website pages in English and Punjabi (/ goes to sign-in; status is public)
        run: |
          curl -fsSL http://localhost:3000/en/status | grep -q "System status"
          curl -fsSL http://localhost:3000/pa/status | grep -q "ਸਿਸਟਮ ਦੀ ਸਥਿਤੀ"
          curl -fsSL http://localhost:3000 | grep -q "Sign in"   # real redirect: / -> /en -> /en/sign-in
          curl -fsSL http://localhost:3000/pa/sign-in | grep -q "ਸਾਈਨ ਇਨ"
          curl -fsSL -H "Accept-Language: pa-IN,pa;q=0.9" http://localhost:3000 | grep -q 'lang="pa"'
      - name: The scheduled assessment service has run and nothing failed
        run: |
          for i in $(seq 1 20); do docker compose logs assessor | grep -q '"failed": 0' && break; sleep 3; done
          docker compose logs assessor | grep -q '"failed": 0'
      - name: The whole flow on fictional data (one command), and a sabotaged run that must fail at the ledger audit
        run: |
          pip install --quiet jsonschema==4.25.1 "psycopg[binary]==3.2.10"   # the simulator feed runs on the runner
          python3 scripts/chain.py --report chain_report.json              # seeds the fixture prices on this fresh stack
          if python3 scripts/chain.py --sabotage ledger --report chain_sabotaged.json; then echo "sabotaged run passed"; exit 1; fi
          python3 -c "import json,sys; r=json.load(open('chain_sabotaged.json')); sys.exit(0 if r['failure']['step']=='ledger-audit' else 1)"
      - name: Login, two-FPO isolation, lots and stock ledger, market reads against the running stack
        run: |
          SMOKE_SEED_MARKET=1 scripts/smoke_access.sh   # imports a fixture price release (invented numbers) first
          scripts/smoke_access.sh http://localhost:3000   # the same checks through the website's API proxy
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
