[project]
name = "kisaniti-api"
version = "0.1.0"
description = "KisanNiti product API (FastAPI + PostgreSQL). Algorithms come from kisaniti-core."
requires-python = ">=3.13,<3.14"
dependencies = [
    "kisaniti-core",
    "fastapi>=0.119,<0.120",
    "uvicorn[standard]>=0.37,<0.39",
    "sqlalchemy>=2.0.44,<2.1",
    "psycopg[binary]>=3.2.10,<3.3",
    "alembic>=1.17,<1.18",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "httpx>=0.28,<0.29",
    "ruff==0.14.1",
    "mypy==1.18.2",
    "jsonschema==4.25.1",
    "referencing==0.36.2",
]

[tool.uv.sources]
kisaniti-core = { path = "../core", editable = true }

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kisaniti_api"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.13"
plugins = []
mypy_path = "src:ingestion/src"

[[tool.mypy.overrides]]
module = ["alembic.*", "jsonschema.*", "referencing.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# ingestion/src: the sensor-table tests drive the ingestion service against this migrated database
pythonpath = ["src", "ingestion/src"]
