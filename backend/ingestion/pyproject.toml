[project]
name = "kisaniti-ingestion"
version = "0.1.0"
description = "KisanNiti MQTT ingestion adapter for storage-node telemetry: validate, de-duplicate, store, acknowledge (contract L3B v1)."
requires-python = ">=3.13,<3.14"
dependencies = [
    "kisaniti-core",
    "paho-mqtt==2.1.0",
    "jsonschema==4.25.1",
    "referencing==0.36.2",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]==3.2.10"]

[project.scripts]
kn-ingest = "kisaniti_ingestion.worker:main"
kn-assess = "kisaniti_ingestion.assess_cli:main"
kn-report = "kisaniti_ingestion.report_cli:main"
kn-sim = "kisaniti_ingestion.simulator:main"
kn-conformance = "kisaniti_ingestion.conformance:main"

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "ruff==0.14.1",
    "mypy==1.18.2",
]

[tool.uv.sources]
kisaniti-core = { path = "../../core", editable = true }

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kisaniti_ingestion"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
strict = true
python_version = "3.13"
# explicit paths: editable-install .pth files can be skipped on macOS when flagged hidden
mypy_path = "src:../../core/src"

[[tool.mypy.overrides]]
module = ["jsonschema.*", "referencing.*", "paho.*", "psycopg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src", "../../core/src"]
